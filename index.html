<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meilen Salamanca | Serious Games Lab</title>
  
  <!-- Fuente Pixel Art desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #1a1c23;
      --card-bg: #282a36;
      --accent-green: #50fa7b;
      --accent-purple: #bd93f9;
      --accent-pink: #ff79c6;
      --text-color: #f8f8f2;
    }

    * {
      box-sizing: border-box;
      image-rendering: pixelated; /* Mantiene la nitidez de imágenes pixel art */
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'VT323', monospace;
      font-size: 22px;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Tarjeta principal con borde pixelado retro */
    .pixel-card {
      background-color: var(--card-bg);
      max-width: 700px;
      width: 100%;
      padding: 30px;
      border: 4px solid #000;
      /* Sombra solida retro sin desenfoque */
      box-shadow: 8px 8px 0px 0px var(--accent-purple);
      position: relative;
    }

    h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 20px;
      color: var(--accent-green);
      text-shadow: 3px 3px 0px #000;
      margin-top: 0;
      line-height: 1.5;
    }

    .subtitle {
      font-size: 24px;
      color: var(--accent-pink);
      margin-bottom: 25px;
    }

    /* Contenedor de Imagen con marco retro */
    .image-frame {
      border: 4px solid #000;
      box-shadow: 4px 4px 0px 0px var(--accent-green);
      background-color: #000;
      margin: 20px 0;
      padding: 5px;
      text-align: center;
    }

    .image-frame img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Botones estilo arcade */
    .pixel-btn {
      display: inline-block;
      font-family: 'Press Start 2P', cursive;
      font-size: 12px;
      color: #000;
      background-color: var(--accent-green);
      padding: 12px 18px;
      text-decoration: none;
      border: 3px solid #000;
      box-shadow: 4px 4px 0px 0px #000;
      margin-top: 15px;
      cursor: pointer;
    }

    .pixel-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px 0px #000;
    }
  </style>
</head>
<body>

  <div class="pixel-card">
    <h1>WELCOME TO MY WEBSITE</h1>
    <p class="subtitle">> Tech Divulgation & Serious Games</p>
    
    <p>All about Serious Games developed in my journey as research.</p>

    <!-- Marco para tu imagen -->
    <div class="image-frame">
      <!-- Asegúrate de colocar el nombre exacto de la imagen que subiste a GitHub -->
      <img src="Capa.png" alt="Serious Games Preview">
    </div>

    <a href="https://github.com/mei-salamanca" class="pixel-btn">START GAME / PROFILE</a>
  </div>

</body>
</html>
